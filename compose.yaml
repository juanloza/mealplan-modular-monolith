services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mealplan
      POSTGRES_USER: mealplan
      POSTGRES_PASSWORD: mealplan
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealplan -d mealplan"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mealplan
    ports:
      - "8080:8080"
